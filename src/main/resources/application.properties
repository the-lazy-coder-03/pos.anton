# PostgreSQL / Neon database
spring.config.import=optional:file:SupportConfigFiles/.env[.properties],optional:file:../SupportConfigFiles/.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Used only by the separate migrate profile; runtime never executes schema changes.
app.database.migration.enabled=${RUN_MIGRATION_SQL:true}

# Server settings
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}
app.business-zone=${APP_BUSINESS_ZONE:Africa/Johannesburg}
resend.api-key=${RESEND_API_KEY:${MAIL_API:}}
resend.from-email=${RESEND_FROM_EMAIL:noreply@email.crowdcam.co.za}

# Secure session cookie settings. Set SESSION_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=native
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.max-file-size=1MB

# Safe error responses
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

# Logging
logging.level.org.springframework.security=INFO

# PostgreSQL runtime security.
app.rls.enabled=true
app.rls.runtime-role=${RLS_RUNTIME_ROLE:pos_runtime}
app.rls.context-secret=${RLS_CONTEXT_SECRET:}
