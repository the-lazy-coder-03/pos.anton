name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onlinepos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend and RLS tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      RLS_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      RLS_TEST_ADMIN_USERNAME: postgres
      RLS_TEST_ADMIN_PASSWORD: ci-test-only
      SPRING_PROFILES_ACTIVE: postgres-test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      RLS_CONTEXT_SECRET: ci-only-rls-context-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Misc/pom.xml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify obsolete tests remain removed
        run: |
          obsolete_tests=(
            src/test/java/org/example/onlinepossystem/OnlinePosSystemApplicationTests.java
            src/test/java/org/example/onlinepossystem/RouteTest.java
            src/test/java/org/example/onlinepossystem/admin/AdminLiveOrderRenderingTest.java
            src/test/java/org/example/onlinepossystem/staff/service/StaffLoginTest.java
            src/test/java/org/example/onlinepossystem/staff/service/StaffServiceDependencyTest.java
          )
          for test_file in "${obsolete_tests[@]}"; do
            if [[ -e "$test_file" ]]; then
              echo "Obsolete test must not run in CI: $test_file" >&2
              exit 1
            fi
          done

      - name: Run PostgreSQL tests and verify package
        run: ./scripts/test-postgres.sh -B verify -Prls-it

  browser-tests:
    name: Browser regression tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      RLS_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      RLS_TEST_ADMIN_USERNAME: postgres
      RLS_TEST_ADMIN_PASSWORD: ci-test-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      RLS_CONTEXT_SECRET: ci-only-rls-context-secret-must-be-at-least-32-characters-long
      GOOGLE_MAPS_API_KEY: ci-placeholder
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Misc/pom.xml

      - name: Set up browser test runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SupportConfigFiles/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build browser test jar
        run: ./Misc/mvnw -f Misc/pom.xml -B package -DskipTests

      - name: Install browser test dependencies
        run: npm --prefix SupportConfigFiles ci

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('SupportConfigFiles/package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          npm --prefix SupportConfigFiles exec -- playwright install-deps chromium
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]]; then
            npm --prefix SupportConfigFiles exec -- playwright install chromium
          fi

      - name: Run browser regression tests
        run: npm --prefix SupportConfigFiles run test:browser

  validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Validate deployment script
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          unexpected_sql="$(git ls-files | grep -Ei '\.sql$' | grep -v '^SQL files/' || true)"
          if [[ -n "$unexpected_sql" ]]; then
            echo "SQL files must be stored in SQL files/:" >&2
            echo "$unexpected_sql" >&2
            exit 1
          fi
          for script in src/main/resources/static/js/*.js; do node --check "$script"; done
          node --check scripts/production-address-smoke.cjs
          python3 scripts/check-template-scripts.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  deploy:
    name: Deploy to LAN server
    runs-on: [self-hosted, linux, x64, pos-anton]
    needs: [backend-tests, browser-tests, validation]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'master')
    timeout-minutes: 30
    concurrency:
      group: onlinepos-production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate deployment prerequisites
        run: |
          test -d /home/matthew/OnlinePosSystem/.git
          test -f /home/matthew/OnlinePosSystem/SupportConfigFiles/.env
          test "$(stat -c '%a' /home/matthew/OnlinePosSystem/SupportConfigFiles/.env)" = 600
          test -f /home/matthew/OnlinePosSystem/docker/docker-compose.override.yml
          test "$(git -C /home/matthew/OnlinePosSystem remote get-url origin)" = https://github.com/the-lazy-coder-03/pos.anton.git

      - name: Set application public URL
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path('/home/matthew/OnlinePosSystem/SupportConfigFiles/.env')
          lines = env_file.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('APP_BASE_URL=')]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one APP_BASE_URL in the production environment')
          lines[matches[0]] = 'APP_BASE_URL=https://pos.anton.com.ng'
          env_file.write_text('\n'.join(lines) + '\n')
          os.chmod(env_file, 0o600)
          PY

      - name: Deploy Docker Compose stack
        id: deploy-stack
        env:
          REMOTE_APP_DIR: /home/matthew/OnlinePosSystem
          DEPLOY_BRANCH: master
          DEPLOY_SHA: ${{ github.sha }}
          DOPPLER_ENABLED: "false"
          PUBLIC_HOST: pos.anton.com.ng
          VERIFY_URL: http://127.0.0.1:18080/
          COMPOSE_OVERRIDE_FILE: docker/docker-compose.override.yml
          KEEP_ROLLBACK_IMAGE: "true"
        run: bash scripts/deploy-production.sh

      - name: Verify LAN application smoke checks
        id: lan-smoke
        run: |
          curl --fail --silent --show-error --max-time 10 https://pos.anton.com.ng/ >/dev/null
          curl --fail --silent --show-error --max-time 10 https://pos.anton.com.ng/login >/dev/null

      - name: Finalize production deployment
        env:
          REMOTE_APP_DIR: /home/matthew/OnlinePosSystem
        run: DEPLOY_ACTION=finalize bash "$REMOTE_APP_DIR/scripts/manage-production-rollback.sh"

      - name: Roll back failed LAN smoke test
        if: failure() && steps.deploy-stack.outcome == 'success' && steps.lan-smoke.outcome == 'failure'
        env:
          REMOTE_APP_DIR: /home/matthew/OnlinePosSystem
          VERIFY_URL: http://127.0.0.1:18080/
          COMPOSE_OVERRIDE_FILE: docker/docker-compose.override.yml
        run: DEPLOY_ACTION=rollback bash "$REMOTE_APP_DIR/scripts/manage-production-rollback.sh"
